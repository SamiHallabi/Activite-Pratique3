<div class="p-3" >
  <div class="card-body" >
    <table class="table" >
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Price</th>
          <th>Selected</th>
        </tr>
      </thead>
      <tbody *ngIf="products" >
      @for(p of products ; track p){
        <tr>
          <td>{{p.id}}</td>
          <td>{{p.name}}</td>
          <td>{{p.price}}</td>
          <td>
            @if (p.selected) {
              <i class="bi bi-check-circle"></i>
            } @else {
              <i class="bi bi-circle"></i>
            }


          </td>
          <td>
            <button (click)="handleDelete" class="btn-outline-danger"  >
            <i class="bi-trash" > </i>
            </button>
          </td>
        </tr>

      }

      </tbody>


    </table>
  </div>

</div>
